spring.application.name=bank-back

spring.datasource.url=jdbc:mariadb://mariadb-bank-vet:3306/db-vetline-bank?createDatabaseIfNotExist=true&useSSL=false
spring.datasource.username=vet-bank
spring.datasource.password=vet-bank
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.level.org.flywaydb=WARN
logging.level.org.springframework.boot.autoconfigure.flyway=WARN
logging.level.org.springframework.jdbc.datasource.init=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

server.port=8083
